name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Upstream release tag or commit to build
        default: v0.6.0
        required: true
        type: string
      publish:
        description: Publish verified binaries as a GitHub release
        default: true
        type: boolean
  workflow_call:
    inputs:
      source_ref:
        default: v0.6.0
        type: string
      publish:
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: umoci-${{ github.workflow }}-${{ inputs.source_ref || 'v0.6.0' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: opencontainers/umoci
          ref: ${{ inputs.source_ref || 'v0.6.0' }}
          persist-credentials: false
      - name: Resolve immutable source
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'v0.6.0' }}
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [[ "$SOURCE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "tag=commit-$commit" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: opencontainers/umoci
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build and smoke test
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p bin
          binary="umoci-$GOOS-$GOARCH"
          go build -mod=vendor -trimpath -buildvcs=false \
            -ldflags="-s -w -X github.com/opencontainers/umoci.gitCommit=$(git rev-parse HEAD)" \
            -o "bin/$binary" ./cmd/umoci
          "bin/$binary" --version
          "bin/$binary" init --layout smoke-image
          "bin/$binary" new --image smoke-image:test
          "bin/$binary" stat --image smoke-image:test
          python3 - "$binary" <<'PY'
          import hashlib, pathlib, sys
          binary = pathlib.Path('bin') / sys.argv[1]
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          binary.with_suffix(binary.suffix + '.sha256').write_text(f'{digest}  {binary.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: umoci-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/umoci-*
          if-no-files-found: error

  release:
    if: inputs.publish && github.event_name != 'pull_request'
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: umoci-*
          path: bin
          merge-multiple: true
      - name: Verify all assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          cd bin
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace immutable assets."
            exit 1
          fi
          printf 'Built from opencontainers/umoci commit %s.\n\n' "$SOURCE_COMMIT" > RELEASE.md
          cat SHA256SUMS >> RELEASE.md
          flags=()
          if [[ "$RELEASE_TAG" == commit-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" umoci-* SHA256SUMS \
            --title "umoci $RELEASE_TAG" --notes-file RELEASE.md "${flags[@]}"
