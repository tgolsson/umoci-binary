name: Build Nightly

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Upstream commit or branch to build (published under its resolved commit SHA)
        default: main
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      publish: true
